              description: 'Also returned as the X-Request-Id header, and in every log line.'
  responses:
    ErrorEnvelope:
      description: 'Any non-2xx response (F5.4). The status code and the `error.code` registry entry carry the meaning; see docs/tds/04-api-contracts-and-events.md §1.3.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mc_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'mct_ API token'
